<!DOCTYPE html>
<html lang="ca">
<head>

    <title>$title$</title>

    $if(css)$
    <link rel="stylesheet" href="$css$">

    $endif$

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <div class="header-left">
        <img src="$institut_logo$" class="logo-img">
        <div>

            <div class="assignatura">$assignatura$ · $curs$</div>

</div>

</html>
