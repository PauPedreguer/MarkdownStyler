<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8">
    <title>$title$</title>

    $if(css)$
    <link rel="stylesheet" href="$css$">

    $endif$

    $if(primary_color)$
    <style>
        :root {
            --color-primari: $primary_color$;
        }
    </style>
    $endif$

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<div class="header">
    <div class="header-left">
        <div class="logo-container">
            <img src="$institut_logo$" class="logo-img">
            <div class="institut-info">
                <span class="institut-name">$institut_nom$</span>
                <div class="header-subtitle">
                    <span class="subject-name">$assignatura$</span>
                    <span class="separator">·</span>
                    <span class="badget-curs">$curs$</span>
                </div>
            </div>
        </div>
    </div>

    <div class="header-center">
        <h1 class="main-title">$title$</h1>
    </div>

    <div class="header-right">
        <div class="meta-item">
            <span class="icon">👤</span> <span>$professor$</span>
        </div>
        <div class="meta-item">
            <span class="icon">📅</span> <span>$data$</span>
        </div>
    </div>
</div>

<div class="layout">
    <button id="sidebar-toggle" title="Amagar/Mostrar barra lateral">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <aside class="sidebar">
        <nav class="sidebar-section toc-container">
            <div class="section-title">SUMARI</div>
            <div class="toc">
                $toc$
            </div>
        </nav>

        <div class="sidebar-footer">
            <button onclick="window.print()" class="print-btn">🖨️ Imprimir pràctica</button>
        </div>
    </aside>

    <main>
        <div class="content">
            $body$
        </div>
    </main>

</div>

<script src="templates/assets/script.js"></script>
</body>
</html>
